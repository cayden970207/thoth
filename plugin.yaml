name: thoth
version: 0.8.0
manifest_version: 2
api_version: 1
description: >-
  Agents working as one team, each with its own harness: Claude Code, Codex and Hermes
  today. Hermes plans tasks on a shared board and hands them to the real Claude Code and
  Codex CLIs, on your own logins and plans, each in its own git worktree, so every
  improvement their makers ship reaches your team. They review each other's work and
  Hermes merges what passes; what one agent decides or makes reaches the next one's
  brief. Claude Code or Codex can join the board directly or take over as coordinator,
  and a task that needs the web gets a clean Chrome, or yours when it needs your logins.
author: Cayden
license: MIT
homepage: https://github.com/cayden970207/thoth
kind: standalone
requires_hermes: ">=0.22.5"
tags: [multi-agent, collaboration, agent-harness, coordination, claude-code, codex, code-review, git]

provides_tools:
  - thoth_init
  - thoth_plan
  - thoth_assign
  - thoth_review
  - thoth_wait
  - thoth_status
  - thoth_note
  - thoth_merge
  - thoth_context
  - thoth_cancel
  - thoth_update_task
  - thoth_coordinator
  - thoth_complete
  - thoth_revise
  - thoth_restore
  - thoth_sync
  - thoth_models
  - thoth_preview
  - thoth_autopilot

provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call

config_schema:
  default_agent:
    type: str
    default: claude
    choices: [claude, codex]
    label: Default worker
    description: Agent used when a task has none.
  claude_permission_mode:
    type: str
    default: acceptEdits
    choices: [acceptEdits, default, plan]
    label: Claude Code permission mode for build runs
    description: acceptEdits lets Claude edit files in the task worktree; shell commands still need the allow-list below.
  claude_sandbox:
    type: bool
    default: true
    label: Run Claude Code's shell commands in its OS sandbox
    description: Lets Claude run tests without prompts while writes stay inside the task worktree (macOS and Linux). Same footing as Codex's workspace-write sandbox.
  lean_workers:
    type: bool
    default: true
    label: Lean workers (fewer tokens per call)
    description: Agents start without your personal plugins, hooks, skills and extra MCP servers (Claude Code) or your config.toml (Codex). Measured 46% fewer prompt tokens per call for Claude Code and 24% for Codex.
  claude_allowed_tools:
    type: list
    default: []
    label: Extra Claude Code allowed tools
    description: 'Added to --allowedTools for build runs, e.g. "Bash(npm test:*)". Read-only git commands are always allowed.'
  claude_model:
    type: str
    default: ""
    label: Claude Code model
    description: Empty uses your Claude Code default.
  codex_model:
    type: str
    default: ""
    label: Codex model
    description: Empty uses your Codex default.
  claude_path:
    type: str
    default: ""
    label: Claude Code CLI path
    description: Empty finds claude on PATH.
  codex_path:
    type: str
    default: ""
    label: Codex CLI path
    description: Empty finds codex on PATH.
  run_timeout_seconds:
    type: int
    default: 1800
    label: Run timeout (seconds)
  max_concurrent_runs:
    type: int
    default: 3
    label: Max agents running at once (per project)
  attach_mcp:
    type: bool
    default: true
    label: Give agents the Thoth tools while they work
    description: Starts the bundled MCP server for each run so agents can read the board and record decisions.
  max_review_rounds:
    type: int
    default: 3
    label: Review rounds before Thoth asks you to decide
    description: After this many reviews that still ask for changes, Needs you offers to merge as it is or send it back again.
  resume_sessions:
    type: bool
    default: true
    label: Resume the agent's previous session when a task is re-assigned
  resume_max_tokens:
    type: int
    default: 600000
    label: Start fresh instead of resuming above this many tokens
    description: Resuming re-sends the agent's whole earlier session on every call. When that session already used more prompt tokens than this, Thoth starts a fresh session with the brief instead.
  link_dependencies:
    type: bool
    default: true
    label: Link node_modules and .venv into task worktrees
    description: A task worktree is a clean checkout without ignored folders, and agents have no network to reinstall them. Thoth links them from the main checkout (agents can read but not change them). A project setup command, when set, replaces this.
  remove_worktree_on_merge:
    type: bool
    default: true
    label: Remove a task's worktree after it is merged (the branch is kept)
  notify_on_complete:
    type: bool
    default: true
    label: Post a message in the chat when a run finishes
  inject_board:
    type: bool
    default: true
    label: Tell Hermes about the board at the start of each turn in a Thoth project
  env_passthrough:
    type: list
    default: []
    label: Environment variables to pass to agents
    description: Thoth strips API keys, tokens and Hermes variables from the agents' environment; list names to keep.
  autopilot_hours:
    type: int
    default: 8
    label: Autopilot time limit (hours)
    description: Autopilot stops and asks you once a plan has run this long (up to 24).
  autopilot_reserve_percent:
    type: int
    default: 20
    label: Share of each plan autopilot leaves you (%)
    description: Autopilot starts nothing with an agent whose plan is used past this point, and waits or uses the other agent instead.
  plan_usage:
    type: bool
    default: true
    label: Watch your Claude and Codex plan usage
    description: Shows how much of each plan is used and hands work to the other agent when one runs out. Claude Code reports it in each run's output; Thoth asks `codex app-server` for Codex's limits, a read that uses no tokens.
