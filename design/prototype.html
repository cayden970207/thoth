<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thoth prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f3f1; --panel: #ffffff; --panel-2: #fafaf9; --sunken: #f1f1ef; --hover: rgba(24,24,27,.045);
  --text: #18181b; --text-2: #52525b; --text-3: #8b8b94; --text-4: #b9b9c0;
  --line: rgba(24,24,27,.075); --line-2: rgba(24,24,27,.12); --dot: rgba(24,24,27,.13);
  --shadow: 0 1px 2px rgba(24,24,27,.04), 0 4px 14px -6px rgba(24,24,27,.08);
  --shadow-lift: 0 2px 6px rgba(24,24,27,.06), 0 18px 36px -14px rgba(24,24,27,.2);
  --claude: #d9774f; --claude-bg: #fbeee8; --claude-ink: #9a4321;
  --codex: #12a37c; --codex-bg: #e5f6f0; --codex-ink: #0b6b52;
  --hermes: #6b52d6; --hermes-bg: #efecfc; --hermes-ink: #4a35a8;
  --ok: #16a34a; --ok-bg: #e8f6ec; --warn: #c17708; --warn-bg: #fdf3e2; --bad: #dc2626; --bad-bg: #fdecec;
  --select: #ef7a3c;
  --primary: #1c1b22; --on-primary: #fff;
  --spring: cubic-bezier(.22,1,.36,1); --ease: cubic-bezier(.4,0,.2,1);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --panel: #17171a; --panel-2: #1b1b1f; --sunken: #121215; --hover: rgba(255,255,255,.05);
  --text: #f3f3f5; --text-2: #b8b8c1; --text-3: #7d7d88; --text-4: #4d4d56;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12); --dot: rgba(255,255,255,.09);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px -6px rgba(0,0,0,.6);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.5), 0 18px 36px -14px rgba(0,0,0,.85);
  --claude-bg: rgba(217,119,79,.15); --claude-ink: #f0a07f;
  --codex-bg: rgba(18,163,124,.15); --codex-ink: #4fd1aa;
  --hermes: #8f7bf0; --hermes-bg: rgba(143,123,240,.16); --hermes-ink: #b5a7ff;
  --ok-bg: rgba(22,163,74,.14); --warn-bg: rgba(193,119,8,.16); --bad-bg: rgba(220,38,38,.14);
  --primary: #f3f3f5; --on-primary: #121214;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; }
.mono { font-family: var(--mono); font-size: 11.5px; }

.shell { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

/* sidebar (Hermes chrome stand-in) */
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 0 8px 18px; letter-spacing: -.01em; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-style: normal; font-size: 13px; }
.side .grp { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-4); padding: 14px 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; color: var(--text-2); font-weight: 500; font-size: 13.5px; text-align: left; }
.nav:hover { background: var(--hover); }
.nav.on { background: var(--sunken); color: var(--text); }
.nav .badge { margin-left: auto; font-size: 11px; background: var(--sunken); border-radius: 6px; padding: 0 6px; color: var(--text-3); }
.nav.on .badge { background: var(--panel); }
.project { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; color: var(--text-2); font-size: 13px; }
.project .sw { width: 8px; height: 8px; border-radius: 3px; }
.project.on { color: var(--text); font-weight: 600; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--sunken); }
.me .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #f6b38e, #d9774f); }
.me small { display: block; color: var(--text-3); font-size: 11.5px; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 14px 26px; border-bottom: 1px solid var(--line); background: var(--panel); }
.crumbs { font-size: 13.5px; color: var(--text-3); display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; white-space: nowrap; }
.crumbs b { color: var(--text); font-weight: 600; }
.sync { display: inline-flex; gap: 6px; align-items: center; color: var(--ok); font-size: 12.5px; font-weight: 500; }
.sync svg { animation: spin 3s linear infinite; }
.sync.idle svg { animation: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.stack { display: flex; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 2px solid var(--panel); margin-left: -7px; position: relative; transition: transform .4s var(--spring); }
.av:first-child { margin-left: 0; }
.av:hover { transform: translateY(-2px); z-index: 2; }
.av .on { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--panel); background: var(--text-4); transition: background .3s; }
.av.busy .on { background: var(--ok); }
.c-claude { background: var(--claude-bg); color: var(--claude-ink); }
.c-codex { background: var(--codex-bg); color: var(--codex-ink); }
.c-hermes { background: var(--hermes-bg); color: var(--hermes-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.chip.sel { border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; }
.chip.sel:hover { background: var(--hover); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 13px; transition: transform .2s var(--spring), background .2s, opacity .2s; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { opacity: .88; }
.btn.sm { height: 28px; padding: 0 11px; font-size: 12px; border-radius: 9px; }
.btn.ghost { border-color: transparent; background: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--hover); }

.content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 18px; }

/* metrics (Merivo-style) */
.metrics { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.5fr) minmax(0, 1.1fr); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.metric { padding: 16px 18px; min-height: 148px; display: flex; flex-direction: column; }
.metric h3 { margin: 0; display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; }
.metric h3 .tile { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; }
.metric h3 .tile svg { width: 15px; height: 15px; }
.metric .big { font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1; margin-top: 14px; font-variant-numeric: tabular-nums; }
.metric .big small { font-size: 16px; color: var(--text-3); font-weight: 500; letter-spacing: 0; }
.metric .sub { font-size: 12px; color: var(--text-3); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.trend { font-weight: 600; font-size: 12px; }
.trend.up { color: var(--ok); }
.segs { display: flex; gap: 5px; margin-top: auto; padding-top: 14px; }
.segs span { flex: 1; height: 6px; border-radius: 3px; background: var(--sunken); transition: background .6s var(--ease); }
.act-row { display: flex; gap: 18px; align-items: flex-end; margin-top: auto; }
.dots { flex: 1; min-width: 0; height: 74px; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-3); margin-left: auto; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
.need-list { display: grid; gap: 8px; margin-top: 12px; }
.need { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); animation: rise .55s var(--spring) both; }
.need.out { animation: sink .4s var(--ease) forwards; }
.need .tx { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.35; }
.need .tx b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.need .tx span { color: var(--text-3); font-size: 11.5px; }
.none { font-size: 12.5px; color: var(--text-3); margin-top: 12px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes sink { to { opacity: 0; transform: scale(.97); height: 0; padding-top: 0; padding-bottom: 0; margin-top: -8px; border-width: 0; } }

/* workspace */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; min-height: 560px; flex: 1; }
.surface { position: relative; overflow: hidden; border-radius: 20px; background: var(--panel-2); border: 1px solid var(--line); min-height: 560px; }
.view { position: absolute; inset: 0; transition: opacity .45s var(--ease), transform .6s var(--spring), filter .45s var(--ease); }
.view.hidden { opacity: 0; transform: scale(.985); filter: blur(5px); pointer-events: none; }

/* canvas (Opero-style) */
.canvasView { background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0); background-size: 20px 20px; }
.world { position: absolute; left: 0; top: 0; width: 980px; height: 560px; transform-origin: 0 0; transition: transform .6s var(--spring); }
.world svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--line-2); stroke-width: 1.5; transition: stroke .4s, opacity .5s; }
.edge.review { stroke-dasharray: 3 5; }
.edge.hot { stroke-width: 2; stroke-dasharray: 5 6; animation: flow .8s linear infinite; }
.edge.done { stroke: var(--ok); opacity: .7; }
.edge.hide { opacity: 0; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.elabel { position: absolute; transform: translate(-50%, -50%); font-size: 11px; color: var(--text-3); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; white-space: nowrap; transition: opacity .5s; }
.node { position: absolute; width: 214px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 12px 12px; transition: box-shadow .3s, border-color .3s, transform .35s var(--spring); cursor: pointer; user-select: none; }
.node:hover { box-shadow: var(--shadow-lift); }
.node.sel { border-color: var(--select); box-shadow: 0 0 0 3px color-mix(in srgb, var(--select) 18%, transparent), var(--shadow-lift); }
.node.drag { transform: scale(1.02) rotate(-.6deg); box-shadow: var(--shadow-lift); cursor: grabbing; transition: none; }
.node .hd { display: flex; align-items: center; gap: 8px; cursor: grab; }
.type { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 7px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.type svg { width: 13px; height: 13px; }
.node .kebab { margin-left: auto; color: var(--text-4); }
.node .ttl { font-weight: 600; font-size: 13.5px; margin: 9px 2px 0; letter-spacing: -.005em; }
.node .meta { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 0; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--sunken); font-size: 11px; color: var(--text-2); font-family: var(--mono); }
.tag.add { color: var(--ok); }
.node .ft { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.mini { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; border: 1.5px solid var(--panel); margin-left: -5px; }
.mini:first-child { margin-left: 0; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 7px; }
.s-todo { background: var(--sunken); color: var(--text-3); }
.s-build { background: var(--hermes-bg); color: var(--hermes-ink); }
.s-review { background: var(--warn-bg); color: var(--warn); }
.s-fix { background: var(--bad-bg); color: var(--bad); }
.s-ok { background: var(--ok-bg); color: var(--ok); }
.s-done { background: var(--primary); color: var(--on-primary); }
.bar2 { height: 3px; border-radius: 3px; background: var(--sunken); overflow: hidden; margin-top: 10px; opacity: 0; transition: opacity .3s; }
.node.working .bar2 { opacity: 1; }
.bar2 span { display: block; height: 100%; width: 35%; border-radius: 3px; animation: slide 1.5s var(--ease) infinite; }
@keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(300%); } }

/* live agent cursors */
.cursor { position: absolute; left: 0; top: 0; pointer-events: none; transition: transform 1.1s var(--spring), opacity .4s; z-index: 5; }
.cursor svg { width: 20px; height: 20px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
.cursor .tagline { display: flex; align-items: center; gap: 6px; margin: -2px 0 0 14px; padding: 3px 9px 3px 4px; border-radius: 999px; color: #fff; font-size: 11.5px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow); }
.cursor .tagline b { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-size: 9.5px; }
.cursor .say { display: block; margin: 4px 0 0 14px; font-size: 11.5px; font-weight: 500; padding: 4px 9px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); color: var(--text-2); max-width: 210px; box-shadow: var(--shadow); transition: opacity .3s; }
.cursor.idle { opacity: 0; }

.zoom { position: absolute; top: 14px; right: 14px; display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; box-shadow: var(--shadow); z-index: 6; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.zoom button { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.zoom button:hover { background: var(--hover); }
.zoom span { min-width: 40px; text-align: center; }

/* floating dock */
.dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 5px; box-shadow: var(--shadow-lift); z-index: 7; }
.seg { position: relative; display: flex; gap: 2px; }
.seg button { position: relative; z-index: 1; height: 34px; padding: 0 14px; border-radius: 11px; font-weight: 600; font-size: 13px; color: var(--text-3); display: inline-flex; gap: 7px; align-items: center; transition: color .3s; }
.seg button.on { color: var(--on-primary); }
.seg .thumb { position: absolute; top: 0; bottom: 0; border-radius: 11px; background: var(--primary); transition: left .55s var(--spring), width .55s var(--spring); }
.dock .div { width: 1px; height: 22px; background: var(--line-2); margin: 0 4px; }
.dock .ib { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--text-2); }
.dock .ib:hover { background: var(--hover); }
.dock .ib.live { color: var(--select); }

/* board (Design System card style) */
.boardView { padding: 16px 16px 80px; overflow: auto; }
.board { display: grid; grid-template-columns: repeat(4, minmax(176px, 1fr)); gap: 12px; min-width: 740px; }
.col { min-width: 0; }
.col h4 { margin: 2px 4px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.col h4 .n { font-size: 11px; color: var(--text-3); background: var(--sunken); border-radius: 6px; padding: 0 6px; font-weight: 500; }
.col h4 .sw { width: 8px; height: 8px; border-radius: 50%; }
.col .lane { display: grid; gap: 12px; min-height: 380px; align-content: start; padding: 2px; border-radius: 16px; transition: background .2s; }
.col .lane.over { background: var(--hover); }
.tcard { min-width: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; cursor: grab; transition: box-shadow .3s, border-color .3s; will-change: transform; }
.tcard:hover { box-shadow: var(--shadow-lift); }
.tcard.sel { border-color: var(--select); }
.tcard .top { display: flex; align-items: center; gap: 10px; }
.tcard .ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--line); flex-shrink: 0; }
.tcard .ico svg { width: 17px; height: 17px; }
.tcard .ttl { font-weight: 600; font-size: 14px; letter-spacing: -.01em; line-height: 1.3; flex: 1; min-width: 0; }
.prog { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; white-space: nowrap; max-width: 100%; padding: 4px 10px 4px 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--text-2); }
.prog .lbl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prog .track { width: 40px; flex-shrink: 0; height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.prog .track span { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .8s var(--spring); }
.tree { margin: 8px 0 0 14px; border-left: 1px solid var(--line-2); padding-left: 0; }
.tree .it { position: relative; display: flex; gap: 8px; align-items: flex-start; padding: 5px 0 5px 16px; font-size: 12.5px; color: var(--text-2); line-height: 1.4; }
.tree .it::before { content: ""; position: absolute; left: 0; top: 13px; width: 11px; height: 1px; background: var(--line-2); }
.tree .it svg { width: 15px; height: 15px; margin-top: 1px; flex-shrink: 0; }
.tree .it.done { color: var(--text-3); }
.props { display: grid; grid-template-columns: 74px 1fr; gap: 8px 10px; align-items: center; margin-top: 12px; font-size: 12.5px; color: var(--text-3); }
.props .k { display: flex; align-items: center; gap: 7px; }
.props .k svg { width: 14px; height: 14px; }
.people { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.person { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 3px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 500; }
.person i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 9.5px; font-weight: 700; }
.lane .empty { border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 26px 10px; text-align: center; color: var(--text-4); font-size: 12px; }

/* inspector */
.workspace { position: relative; }
.workspace.board-mode { grid-template-columns: minmax(0, 1fr); }
.workspace.board-mode .inspector { position: absolute; top: 10px; right: 10px; bottom: 10px; width: 340px; z-index: 12; box-shadow: var(--shadow-lift); transform: translateX(calc(100% + 30px)); opacity: 0; transition: transform .6s var(--spring), opacity .3s; overflow: auto; }
.workspace.board-mode.open .inspector { transform: none; opacity: 1; }
.closeI { display: none; margin-left: 6px; width: 30px; height: 30px; border-radius: 9px; place-items: center; color: var(--text-3); flex-shrink: 0; }
.closeI:hover { background: var(--hover); }
.workspace.board-mode .closeI { display: grid; }
.ihead { display: flex; align-items: center; }

.inspector { padding: 16px; display: flex; flex-direction: column; min-height: 560px; }
.tabs { display: flex; gap: 2px; background: var(--sunken); border-radius: 11px; padding: 3px; }
.tabs button { flex: 1; height: 28px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-3); transition: background .25s, color .25s; }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.pane { margin-top: 16px; }
.pane.enter { animation: fade .4s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.sec { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-4); margin: 18px 0 8px; display: flex; justify-content: space-between; }
.ver { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.ver:last-child { border-bottom: 0; }
.ver .lbl { color: var(--text-2); flex: 1; }
.actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

.ev .mini { width: 26px; height: 26px; font-size: 10.5px; margin: 0; border: 0; }
.ev .tx { font-size: 12.5px; color: var(--text-2); line-height: 1.45; }
.ev .tx b { color: var(--text); font-weight: 600; }
.ev .q { display: block; margin-top: 6px; padding: 8px 10px; border-radius: 11px; background: var(--sunken); color: var(--text); font-size: 12px; }

.filters { display: flex; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
.filters button { height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--text-3); border: 1px solid transparent; }
.filters button.on { border-color: var(--line-2); color: var(--text); background: var(--panel); }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 24px); opacity: 0; background: var(--primary); color: var(--on-primary); padding: 10px 16px; border-radius: 13px; font-size: 13px; font-weight: 500; display: flex; gap: 12px; align-items: center; transition: transform .55s var(--spring), opacity .3s; box-shadow: var(--shadow-lift); z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast a { opacity: .65; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

@media (max-width: 1280px) { .metrics { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .metrics .m-act { grid-column: 1 / -1; order: 3; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

<script>
const $ = (s, el = document) => el.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const AG = {
  hermes: { name: 'Hermes', s: 'H', c: 'var(--hermes)', cls: 'c-hermes' },
  claude: { name: 'Claude Code', s: 'C', c: 'var(--claude)', cls: 'c-claude' },
  codex:  { name: 'Codex', s: 'X', c: 'var(--codex)', cls: 'c-codex' },
};
const STAGES = { todo: ['Planned', 's-todo'], build: ['Building', 's-build'], review: ['In review', 's-review'], fix: ['Changes asked', 's-fix'], ok: ['Approved', 's-ok'], done: ['Merged', 's-done'] };
const COLS = [['todo', 'Planned', 'var(--text-4)'], ['build', 'Building', 'var(--hermes)'], ['review', 'In review', 'var(--warn)'], ['done', 'Done', 'var(--ok)']];
const colOf = st => st === 'fix' ? 'build' : st === 'ok' ? 'review' : st;

const fresh = () => ({
  coord: 'hermes', selected: 'T1', tab: 'task', filter: 'all', zoom: 1,
  agents: { hermes: { say: '', busy: false, at: 'G' }, claude: { say: '', busy: false, at: null }, codex: { say: '', busy: false, at: null } },
  tasks: {
    T1: { title: 'Build the calculator page', agent: 'claude', reviewer: 'codex', st: 'todo', file: 'index.html', add: 0, commits: [], issues: [] },
    T2: { title: 'Tip logic with validation', agent: 'codex', reviewer: 'claude', st: 'todo', file: 'tip.js', add: 0, commits: [], issues: [] },
    T3: { title: 'Tests for tip.js', agent: 'codex', reviewer: 'claude', st: 'todo', file: 'tip.test.js', add: 0, commits: [], issues: [], after: 'T2' },
  },
  events: [], needs: [], actions: [], reviewsOn: false,
});
let S = fresh(), view = 'canvas', run = 0;

const POS = { G: [40, 222], T1: [330, 70], T2: [330, 350], T3: [650, 410], M: [690, 150] };
const EDGES = [['G', 'T1'], ['G', 'T2'], ['T1', 'M'], ['T2', 'M'], ['T2', 'T3', 'after'], ['T1', 'T2', 'cross-review', 'review']];

/* ---------------- canvas ---------------- */
function nodeHTML(id) {
  if (id === 'G') return `<div class="hd"><span class="type c-hermes"><svg><use href="#i-plan"/></svg>Plan</span><svg class="i kebab"><use href="#i-dots"/></svg></div>
    <div class="ttl">A tiny web tip calculator</div><div class="meta"><span class="tag">3 tasks</span><span class="tag">1 contract</span></div>
    <div class="ft"><span class="mini c-hermes">H</span><span class="status s-ok">Planned</span></div>`;
  if (id === 'M') {
    const n = Object.values(S.tasks).filter(t => t.st === 'done').length;
    return `<div class="hd"><span class="type" style="background:var(--sunken);color:var(--text-2)"><svg><use href="#i-merge"/></svg>Main</span><svg class="i kebab"><use href="#i-dots"/></svg></div>
    <div class="ttl">Merge into main</div><div class="meta"><span class="tag">${n} merged</span>${n ? '<span class="tag add">7f3a1c2</span>' : ''}</div>
    <div class="ft"><span style="font-size:11.5px;color:var(--text-3)">Needs your approval</span><span class="status ${n ? 's-ok' : 's-todo'}">${n ? 'Up to date' : 'Waiting'}</span></div>`;
  }
  const t = S.tasks[id], a = AG[t.agent], [label, cls] = STAGES[t.st];
  const kind = t.st === 'review' || t.st === 'ok' ? ['review', 'Review'] : ['build', 'Build'];
  return `<div class="hd"><span class="type ${a.cls}"><svg><use href="#i-${kind[0]}"/></svg>${kind[1]}</span><span class="mono" style="color:var(--text-4)">${id}</span><svg class="i kebab"><use href="#i-dots"/></svg></div>
    <div class="ttl">${t.title}</div>
    <div class="meta"><span class="tag">${t.file}</span>${t.add ? `<span class="tag add">+${t.add}</span>` : ''}${t.commits.length ? `<span class="tag">${t.commits.at(-1)}</span>` : ''}${t.after && t.st === 'todo' ? `<span class="tag">after ${t.after}</span>` : ''}</div>
    <div class="ft"><span style="display:flex"><span class="mini ${a.cls}">${a.s}</span>${S.reviewsOn || t.st !== 'todo' && t.st !== 'build' ? `<span class="mini ${AG[t.reviewer].cls}">${AG[t.reviewer].s}</span>` : ''}</span><span class="status ${cls}">${label}${t.st === 'fix' ? ` · ${t.issues.filter(i => !i.done).length}` : ''}</span></div>
    <div class="bar2"><span style="background:${a.c}"></span></div>`;
}
function buildCanvas() {
  const w = $('#world');
  w.querySelectorAll('.node,.cursor,.elabel').forEach(e => e.remove());
  for (const id of Object.keys(POS)) {
    const n = document.createElement('div');
    n.className = 'node'; n.id = 'n-' + id;
    n.style.left = POS[id][0] + 'px'; n.style.top = POS[id][1] + 'px';
    n.onclick = e => { if (n.dataset.moved) { delete n.dataset.moved; return; } if (S.tasks[id]) select(id); };
    makeDraggable(n, id);
    w.appendChild(n);
  }
  EDGES.forEach(([a, b, label]) => { if (!label) return; const l = document.createElement('span'); l.className = 'elabel'; l.id = `l-${a}-${b}`; l.textContent = label; w.appendChild(l); });
  for (const k of Object.keys(AG)) {
    const c = document.createElement('div');
    c.className = 'cursor idle'; c.id = 'cur-' + k;
    c.innerHTML = `<svg style="color:${AG[k].c}"><use href="#i-arrow"/></svg><div class="tagline" style="background:${AG[k].c}"><b>${AG[k].s}</b>${AG[k].name}</div><span class="say"></span>`;
    w.appendChild(c);
  }
  paintCanvas(); fit();
}
function box(id) { const n = $('#n-' + id); return { x: POS[id][0], y: POS[id][1], w: n ? n.offsetWidth : 214, h: n ? n.offsetHeight : 120 }; }
function elbow(x1, y1, x2, y2) {
  const mx = Math.round((x1 + x2) / 2), r = Math.min(12, Math.abs(y2 - y1) / 2, Math.abs(mx - x1));
  if (Math.abs(y2 - y1) < 2) return `M${x1},${y1} H${x2}`;
  const dy = y2 > y1 ? 1 : -1;
  return `M${x1},${y1} H${mx - r} Q${mx},${y1} ${mx},${y1 + r * dy} V${y2 - r * dy} Q${mx},${y2} ${mx + r},${y2} H${x2}`;
}
function drawEdges() {
  const svg = $('#edges'); let html = '';
  for (const [a, b, label, kind] of EDGES) {
    const A = box(a), B = box(b);
    let d, lx, ly;
    if (kind === 'review') {
      const x = A.x + A.w / 2 + 40; d = `M${x},${A.y + A.h} V${B.y}`; lx = x; ly = (A.y + A.h + B.y) / 2;
    } else if (label === 'after') {
      const x1 = A.x + A.w, y1 = A.y + A.h - 34, x2 = B.x, y2 = B.y + 40; d = elbow(x1, y1, x2, y2); lx = (x1 + x2) / 2; ly = (y1 + y2) / 2;
    } else {
      const x1 = A.x + A.w, y1 = A.y + A.h / 2, x2 = B.x, y2 = B.y + B.h / 2; d = elbow(x1, y1, x2, y2); lx = (x1 + x2) / 2; ly = (y1 + y2) / 2;
    }
    html += `<path class="edge ${kind || ''}" id="e-${a}-${b}" d="${d}"/>`;
    const l = $(`#l-${a}-${b}`); if (l) { l.style.left = lx + 'px'; l.style.top = ly + 'px'; }
  }
  svg.innerHTML = html;
  paintEdges();
}
function paintEdges() {
  const st = id => S.tasks[id] ? S.tasks[id].st : '';
  const set = (a, b, cls, color) => { const e = $(`#e-${a}-${b}`); if (!e) return; e.classList.remove('hot', 'done'); e.style.stroke = ''; if (cls) e.classList.add(cls); if (color) e.style.stroke = color; };
  ['T1', 'T2'].forEach(t => set('G', t, st(t) === 'build' && S.agents[S.tasks[t].agent].busy ? 'hot' : st(t) !== 'todo' ? 'done' : '', st(t) === 'build' && S.agents[S.tasks[t].agent].busy ? AG[S.tasks[t].agent].c : ''));
  ['T1', 'T2'].forEach(t => set(t, 'M', st(t) === 'done' ? 'done' : ''));
  set('T2', 'T3', st('T3') !== 'todo' ? 'done' : '');
  const rv = $('#e-T1-T2'), rl = $('#l-T1-T2');
  const reviewing = S.agents.claude.busy && S.agents.claude.say.startsWith('Review') || S.agents.codex.busy && S.agents.codex.say.startsWith('Review') || S.agents.codex.say.startsWith('Checking');
  if (rv) { rv.classList.toggle('hide', !S.reviewsOn); if (reviewing) { rv.classList.add('hot'); rv.style.stroke = 'var(--warn)'; } }
  if (rl) rl.style.opacity = S.reviewsOn ? 1 : 0;
}
function paintCanvas() {
  for (const id of Object.keys(POS)) {
    const n = $('#n-' + id); if (!n) continue;
    n.innerHTML = nodeHTML(id);
    n.classList.toggle('sel', S.selected === id);
    const t = S.tasks[id];
    n.classList.toggle('working', !!t && ((t.st === 'build' || t.st === 'fix') && S.agents[t.agent].busy || t.st === 'review' && S.agents[t.reviewer].busy));
  }
  drawEdges(); paintCursors();
}
function paintCursors() {
  for (const k of Object.keys(AG)) {
    const c = $('#cur-' + k); if (!c) continue;
    const a = S.agents[k];
    const show = a.busy && a.at;
    c.classList.toggle('idle', !show);
    if (a.at) { const b = box(a.at); const off = { hermes: [b.w - 34, -14], claude: [b.w - 50, b.h - 22], codex: [b.w - 40, b.h - 18] }[k]; c.style.transform = `translate(${b.x + off[0]}px, ${b.y + off[1]}px)`; }
    $('.say', c).textContent = a.say; $('.say', c).style.opacity = a.say ? 1 : 0;
  }
}
function makeDraggable(n, id) {
  let sx, sy, ox, oy, moving = false;
  n.addEventListener('pointerdown', e => {
    if (!e.target.closest('.hd')) return;
    sx = e.clientX; sy = e.clientY; [ox, oy] = POS[id]; moving = true; n.setPointerCapture(e.pointerId);
  });
  n.addEventListener('pointermove', e => {
    if (!moving) return;
    const dx = (e.clientX - sx) / S.zoom, dy = (e.clientY - sy) / S.zoom;
    if (Math.abs(dx) + Math.abs(dy) > 3) { n.classList.add('drag'); n.dataset.moved = 1; }
    POS[id] = [ox + dx, oy + dy]; n.style.left = POS[id][0] + 'px'; n.style.top = POS[id][1] + 'px';
    drawEdges(); paintCursors();
  });
  n.addEventListener('pointerup', () => { moving = false; n.classList.remove('drag'); });
}
function fit() {
  const sv = $('#surface'); const w = sv.clientWidth - 40, h = sv.clientHeight - 110;
  S.zoom = Math.max(.5, Math.min(1.1, w / 920, h / 560));
  applyZoom();
}
function applyZoom() {
  const sv = $('#surface');
  const ox = Math.max(10, (sv.clientWidth - 920 * S.zoom) / 2), oy = 22;
  $('#world').style.transform = `translate(${ox}px, ${oy}px) scale(${S.zoom})`;
  $('#zval').textContent = Math.round(S.zoom * 100) + '%';
}
$('#zin').onclick = () => { S.zoom = Math.min(1.6, S.zoom + .1); applyZoom(); };
$('#zout').onclick = () => { S.zoom = Math.max(.4, S.zoom - .1); applyZoom(); };
$('#fitBtn').onclick = fit;

/* ---------------- board ---------------- */
function cardHTML(id) {
  const t = S.tasks[id], a = AG[t.agent], [label, cls] = STAGES[t.st];
  const open = t.issues.filter(i => !i.done).length, total = t.issues.length;
  const pct = total ? Math.round((total - open) / total * 100) : (t.st === 'ok' || t.st === 'done' ? 100 : 0);
  const progLabel = total ? `${total - open} of ${total} fixed` : t.st === 'ok' || t.st === 'done' ? 'Review passed' : t.st === 'todo' ? 'Not started' : 'In progress';
  return `<div class="top"><span class="ico ${a.cls}"><svg><use href="#i-${t.st === 'review' || t.st === 'ok' ? 'review' : 'build'}"/></svg></span><div class="ttl">${t.title}</div><svg class="i" style="color:var(--text-4)"><use href="#i-dots"/></svg></div>
    <span class="prog"><svg class="i" style="width:15px;height:15px;color:var(--text-3)"><use href="#i-ring"/></svg><span class="lbl">${progLabel}</span><span class="track"><span style="width:${pct}%"></span></span>${pct}%</span>
    ${total ? `<div class="tree">${t.issues.map(i => `<div class="it ${i.done ? 'done' : ''}"><svg style="color:${i.done ? 'var(--text-2)' : 'var(--text-4)'}"><use href="#i-${i.done ? 'check' : 'ring'}"/></svg>${i.short}</div>`).join('')}</div>` : ''}
    <div class="props"><span class="k"><svg><use href="#i-flag"/></svg>Status</span><span><span class="status ${cls}">${label}</span></span>
      <span class="k"><svg><use href="#i-branch"/></svg>Version</span><span class="mono" style="color:var(--text-2)">${t.commits.at(-1) || '—'}${t.add ? ` <span style="color:var(--ok)">+${t.add}</span>` : ''}</span></div>
    <div class="people"><span class="person"><i class="${a.cls}">${a.s}</i>${a.name.split(' ')[0]}</span>${t.st !== 'todo' ? `<span class="person" title="Reviewer"><i class="${AG[t.reviewer].cls}">${AG[t.reviewer].s}</i>${AG[t.reviewer].name.split(' ')[0]}</span>` : ''}</div>`;
}
function buildBoard() {
  const b = $('#board');
  b.innerHTML = COLS.map(([k, label, sw]) => `<div class="col" data-col="${k}"><h4><span class="sw" style="background:${sw}"></span>${label}<span class="n"></span></h4><div class="lane"></div></div>`).join('');
  b.querySelectorAll('.lane').forEach(lane => {
    lane.ondragover = e => { e.preventDefault(); lane.classList.add('over'); };
    lane.ondragleave = () => lane.classList.remove('over');
    lane.ondrop = e => { e.preventDefault(); lane.classList.remove('over'); dropTo(e.dataTransfer.getData('text/plain'), lane.parentNode.dataset.col); };
  });
  for (const id of Object.keys(S.tasks)) {
    const c = document.createElement('article');
    c.className = 'tcard'; c.id = 'c-' + id; c.draggable = true;
    c.ondragstart = e => e.dataTransfer.setData('text/plain', id);
    c.onclick = () => select(id);
    $(`.col[data-col="${colOf(S.tasks[id].st)}"] .lane`, b).appendChild(c);
  }
  paintBoard();
}
function paintBoard() {
  if (view !== 'board') return;
  for (const id of Object.keys(S.tasks)) { const c = $('#c-' + id); if (!c) continue; c.innerHTML = cardHTML(id); c.classList.toggle('sel', S.selected === id); }
  $('#board').querySelectorAll('.col').forEach(col => {
    const lane = $('.lane', col), n = lane.querySelectorAll('.tcard').length;
    $('.n', col).textContent = n;
    let e = $('.empty', lane);
    if (!n && !e) { e = document.createElement('div'); e.className = 'empty'; e.textContent = { review: 'Cross-reviews land here', done: 'Merged work lands here', build: 'Nothing building', todo: 'Nothing planned' }[col.dataset.col]; lane.appendChild(e); }
    if (n && e) e.remove();
  });
}
function flipMove(id) {
  if (view !== 'board') return;
  const c = $('#c-' + id); if (!c) return;
  const lane = $(`.col[data-col="${colOf(S.tasks[id].st)}"] .lane`);
  if (c.parentNode === lane) return;
  const r1 = c.getBoundingClientRect(); lane.appendChild(c); const r2 = c.getBoundingClientRect();
  c.style.transition = 'none'; c.style.transform = `translate(${r1.left - r2.left}px, ${r1.top - r2.top}px) rotate(${r1.left < r2.left ? 1.5 : -1.5}deg)`;
  c.getBoundingClientRect();
  c.style.transition = 'transform .75s var(--spring), box-shadow .3s'; c.style.transform = '';
}

/* ---------------- inspector ---------------- */
function select(id) { S.selected = id; S.tab = 'task'; $('.workspace').classList.add('open'); paintAll(); }
$('#closeI').onclick = () => $('.workspace').classList.remove('open');
let lastPane = '';
function paintInspector() {
  $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const pane = $('#pane');
  const key = S.tab + ':' + S.selected + ':' + S.filter;
  const enter = key !== lastPane; lastPane = key;
  requestAnimationFrame(() => { const p = $('.pane', pane); if (p && enter) p.classList.add('enter'); });
  if (S.tab === 'brain') {
    const list = S.events.filter(e => S.filter === 'all' || e.kind === S.filter);
    pane.innerHTML = `<div class="pane"><div class="filters">${['all', 'decision', 'review', 'version'].map(f => `<button data-f="${f}" class="${S.filter === f ? 'on' : ''}">${f === 'all' ? 'All' : f[0].toUpperCase() + f.slice(1) + 's'}</button>`).join('')}</div>
      <div style="margin-top:8px">${list.map(e => `<div class="ev"><span class="mini ${AG[e.who].cls}">${AG[e.who].s}</span><div class="tx"><b>${AG[e.who].name}</b> ${e.html}${e.q ? `<span class="q">${e.q}</span>` : ''}<time>${ago(e.t)}</time></div></div>`).join('') || '<div class="none">Decisions, reviews and versions from every agent show up here.</div>'}</div></div>`;
    pane.querySelectorAll('.filters button').forEach(b => b.onclick = () => { S.filter = b.dataset.f; paintInspector(); });
    return;
  }
  const id = S.selected, t = S.tasks[id], a = AG[t.agent];
  const [label, cls] = STAGES[t.st];
  const open = t.issues.filter(i => !i.done).length;
  let action = '';
  if (t.st === 'ok') action = `<button class="btn primary" data-act="merge">Merge into main</button>`;
  else if (t.st === 'fix') action = `<button class="btn primary" data-act="fix">Send back to ${a.name}</button>`;
  else if (t.st === 'todo') action = `<button class="btn primary" data-act="start">Start ${a.name}</button>`;
  pane.innerHTML = `<div class="pane">
    <div style="display:flex;gap:12px;align-items:center"><span class="ico ${a.cls}" style="width:40px;height:40px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--line)"><svg class="i" style="width:19px;height:19px"><use href="#i-build"/></svg></span>
      <div style="flex:1;min-width:0"><div class="mono" style="color:var(--text-4)">${id}</div><div style="font-weight:600;font-size:16px;letter-spacing:-.015em;line-height:1.3">${t.title}</div></div></div>
    ${t.issues.length ? `<span class="prog"><svg class="i" style="width:15px;height:15px;color:var(--text-3)"><use href="#i-ring"/></svg>${t.issues.length - open} of ${t.issues.length} fixed<span class="track"><span style="width:${(t.issues.length - open) / t.issues.length * 100}%"></span></span></span>
    <div class="tree">${t.issues.map(i => `<div class="it ${i.done ? 'done' : ''}"><svg style="color:${i.done ? 'var(--text-2)' : 'var(--text-4)'}"><use href="#i-${i.done ? 'check' : 'ring'}"/></svg><span><span class="mono" style="color:var(--text-4);display:block">${i.loc}</span>${i.text}</span></div>`).join('')}</div>` : ''}
    <div class="props" style="grid-template-columns:84px 1fr">
      <span class="k"><svg><use href="#i-flag"/></svg>Status</span><span><span class="status ${cls}">${label}</span></span>
      <span class="k"><svg><use href="#i-build"/></svg>Builder</span><span><span class="chip sel" style="height:24px"><span class="mini ${a.cls}" style="width:18px;height:18px;border:0">${a.s}</span>${a.name}<svg class="i" style="width:12px;height:12px;color:var(--text-3)"><use href="#i-chev"/></svg></span></span>
      <span class="k"><svg><use href="#i-review"/></svg>Reviewer</span><span><span class="chip sel" style="height:24px"><span class="mini ${AG[t.reviewer].cls}" style="width:18px;height:18px;border:0">${AG[t.reviewer].s}</span>${AG[t.reviewer].name}<svg class="i" style="width:12px;height:12px;color:var(--text-3)"><use href="#i-chev"/></svg></span></span>
      <span class="k"><svg><use href="#i-branch"/></svg>Branch</span><span class="mono" style="color:var(--text-2)">thoth/${id}-${t.file.split('.')[0]}</span>
    </div>
    <div class="sec">Versions<span>${t.commits.length}</span></div>
    ${t.commits.length ? t.commits.map((c, i) => `<div class="ver"><span class="mono">${c}</span><span class="lbl">${i ? 'Fixes from review' : 'First build'}</span><span class="mini ${a.cls}" style="border:0">${a.s}</span></div>`).join('') : '<div class="none" style="margin:0">No versions yet</div>'}
    <div class="actions">${action}<button class="btn">Open diff</button></div></div>`;
  pane.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ({ merge: () => merge(id), fix: () => sendBack(id), start: () => toast(`Asking for approval to start ${a.name}…`) })[b.dataset.act]());
}
$('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; paintInspector(); });

/* ---------------- metrics ---------------- */
const COLS_N = 46, ROWS_N = 6;
function paintDots() {
  const svg = $("#dotgrid"); const W = COLS_N * 10, H = ROWS_N * 12;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let html = '';
  for (let c = 0; c < COLS_N; c++) for (let r = 0; r < ROWS_N; r++) {
    const i = c * ROWS_N + r, a = S.actions[i];
    html += `<circle cx="${c * 10 + 5}" cy="${H - (r * 12 + 6)}" r="${a ? 3.2 : 2.3}" fill="${a ? AG[a].c : 'var(--dot)'}"${a && i === S.actions.length - 1 ? ' style="transition:r .3s"' : ''}/>`;
  }
  svg.innerHTML = html;
  $('#mAct').textContent = S.actions.length;
}
function paintMetrics() {
  const done = Object.entries(S.tasks).filter(([, t]) => t.st === 'done');
  $('#mShip').innerHTML = `${done.length}<small> / 3 tasks</small>`;
  $('#mShipTrend').textContent = done.length ? `+${done.length}` : '';
  $('#mShipSub').textContent = done.length ? 'merged this session' : 'Nothing merged yet';
  $('#mSegs').querySelectorAll('span').forEach((s, i) => { const t = Object.values(S.tasks)[i]; s.style.background = t.st === 'done' ? AG[t.agent].c : t.st === 'todo' ? '' : `color-mix(in srgb, ${AG[t.agent].c} 30%, transparent)`; });
  const needs = $('#needs');
  $('#mNeedN').textContent = S.needs.length; $('#mNeedN').className = 'status ' + (S.needs.length ? 's-fix' : 's-todo');
  $('#navBadge').textContent = S.needs.length || ''; $('#navBadge').style.display = S.needs.length ? '' : 'none';
  needs.innerHTML = S.needs.length ? `<div class="need-list">${S.needs.map(n => `<div class="need" data-id="${n.id}"><span class="mini ${AG[n.who].cls}" style="width:26px;height:26px;border:0;font-size:10.5px">${AG[n.who].s}</span><div class="tx"><b>${n.title}</b><span>${n.sub}</span></div><button class="btn sm primary">${n.cta}</button></div>`).join('')}</div>` : '<div class="none">You’re all caught up. Thoth will ask here when a merge or a fix needs you.</div>';
  needs.querySelectorAll('.need').forEach(el => { const n = S.needs.find(x => x.id === el.dataset.id); $('button', el).onclick = () => n.run(); el.onclick = e => { if (!e.target.closest('button')) select(n.task); }; });
  const busy = Object.values(S.agents).some(a => a.busy);
  $('#sync').classList.toggle('idle', !busy);
  $('#sync span').textContent = busy ? 'Syncing live' : 'Synced just now';
}

/* ---------------- team & coordinator ---------------- */
function paintTeam() {
  $('#team').innerHTML = Object.entries(AG).map(([k, a]) => `<span class="av ${a.cls} ${S.agents[k].busy ? 'busy' : ''}" title="${a.name}">${a.s}<span class="on"></span></span>`).join('');
  $('#coordName').textContent = AG[S.coord].name;
}
$('#coordChip').onclick = () => {
  const order = ['hermes', 'claude', 'codex']; const prev = S.coord;
  S.coord = order[(order.indexOf(S.coord) + 1) % 3];
  addEvent(S.coord, 'decision', 'took over as coordinator');
  paintTeam(); toast(`${AG[S.coord].name} is coordinating now <a id="undoC">Undo</a>`);
  $('#undoC').onclick = () => { S.coord = prev; paintTeam(); toast(`${AG[prev].name} is coordinating again`); };
};

/* ---------------- state changes ---------------- */
function paintAll() { paintTeam(); paintCanvas(); paintBoard(); paintInspector(); paintMetrics(); paintDots(); }
function setAgent(k, say, busy, at) { Object.assign(S.agents[k], { say, busy }); if (at !== undefined) S.agents[k].at = at; paintAll(); }
function setTask(id, patch) { Object.assign(S.tasks[id], patch); flipMove(id); paintAll(); }
function addEvent(who, kind, html, q) { S.events.unshift({ who, kind, html, q, t: Date.now() }); if (S.tab === 'brain') paintInspector(); }
function ago(t) { const s = Math.round((Date.now() - t) / 1000); return s < 5 ? 'just now' : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`; }
function addNeed(n) { S.needs.push(n); paintMetrics(); }
function resolveNeed(id) {
  const el = $(`.need[data-id="${id}"]`);
  S.needs = S.needs.filter(n => n.id !== id);
  if (el) { el.classList.add('out'); setTimeout(paintMetrics, 380); } else paintMetrics();
}
let ticker = setInterval(() => {
  for (const k of Object.keys(AG)) if (S.agents[k].busy && S.actions.length < COLS_N * ROWS_N) S.actions.push(k);
  paintDots();
}, 420);

let toastT;
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3400); }

function merge(id) {
  resolveNeed('merge-' + id);
  setTask(id, { st: 'done' });
  addEvent('hermes', 'version', `merged ${id} into <span class="mono">main</span>`, null);
  toast(`Merged ${id} into main · <span class="mono">7f3a1c2</span>`);
}
async function sendBack(id) {
  resolveNeed('fix-' + id);
  const r = run;
  setTask(id, { st: 'fix' });
  setAgent('claude', 'Fixing 2 comments in my last session', true, id);
  await sleep(2600); if (r !== run) return;
  S.tasks[id].issues.forEach(i => i.done = true);
  setTask(id, { st: 'review', add: 300, commits: [...S.tasks[id].commits, '66a6a3b'] });
  setAgent('claude', '', false, id);
  setAgent('codex', 'Checking Claude’s fixes', true, id);
  await sleep(2400); if (r !== run) return;
  S.tasks[id].issues.push({ loc: 'index.html:221', short: 'Round money values safely', text: 'A $48.50 bill at 15% shows a 7.27 tip next to a 55.78 total.', done: false });
  setTask(id, { st: 'fix' });
  setAgent('codex', '', false, id);
  addEvent('codex', 'review', 'confirmed both fixes and caught a rounding bug', 'Tip shows 7.27 next to a total of 55.78.');
  addNeed({ id: 'fix-' + id + '-2', task: id, who: 'codex', title: 'One more fix on T1', sub: 'Rounding bug in the totals', cta: 'Send back', run: () => { resolveNeed('fix-' + id + '-2'); toast('Claude Code is on it'); } });
}
function dropTo(id, col) {
  if (!id) return;
  const t = S.tasks[id];
  if (col === 'done') { if (t.st !== 'ok') { toast(`${id} needs an approving review before it can merge`); paintBoard(); return; } merge(id); return; }
  setTask(id, { st: col });
}

/* ---------------- replay of the real session ---------------- */
async function replay() {
  const r = ++run, ok = () => r === run;
  const keepZoom = S.zoom;
  S = fresh(); S.zoom = keepZoom;
  if (view === 'board') buildBoard(); else buildCanvas();
  paintAll();
  $('#replay').classList.add('live');
  const at = async ms => { await sleep(ms); return ok(); };
  if (!await at(500)) return;
  setAgent('hermes', 'Planning the work', true, 'G');
  addEvent('hermes', 'decision', 'set the shared contract', '<span class="mono">calculateTip(bill, percent, people)</span>');
  if (!await at(1600)) return;
  setTask('T1', { st: 'build' }); setTask('T2', { st: 'build' });
  setAgent('hermes', '', false, 'G');
  setAgent('claude', 'Writing index.html', true, 'T1');
  setAgent('codex', 'Writing tip.js', true, 'T2');
  if (!await at(2400)) return;
  setAgent('claude', 'Proposing { tip, total, perPerson }', true);
  addEvent('claude', 'decision', 'proposed the return shape', '<span class="mono">{ tip, total, perPerson }</span>');
  if (!await at(1600)) return;
  setAgent('codex', 'Agreed — same contract', true);
  addEvent('codex', 'decision', 'read the brain and agreed to the same contract', null);
  if (!await at(1800)) return;
  S.reviewsOn = true;
  setTask('T1', { st: 'review', add: 282, commits: ['8e9260e'] });
  setTask('T2', { st: 'review', add: 33, commits: ['48db490'] });
  addEvent('hermes', 'version', 'committed both tasks on their own branches', '<span class="mono">8e9260e</span> · <span class="mono">48db490</span>');
  setAgent('claude', 'Reviewing Codex’s tip.js', true, 'T2');
  setAgent('codex', 'Reviewing Claude’s page', true, 'T1');
  if (!await at(2800)) return;
  S.tasks.T1.issues = [
    { loc: 'index.html:230', short: 'Ignore stale submissions', text: 'A late error from an earlier submit can sit on top of a newer, valid result.', done: false },
    { loc: 'index.html:167', short: 'Explain the file:// case', text: 'Opening the page from a file says “calculateTip was not found” instead of how to fix it.', done: false },
  ];
  setTask('T2', { st: 'ok' }); setTask('T1', { st: 'fix' });
  setAgent('claude', '', false); setAgent('codex', '', false);
  setAgent('hermes', 'Waiting for you', false, 'M');
  addEvent('claude', 'review', 'approved Codex’s tip logic', null);
  addEvent('codex', 'review', 'asked for 2 changes on Claude’s page', 'A late error can sit on top of a newer, valid result.');
  addNeed({ id: 'merge-T2', task: 'T2', who: 'claude', title: 'T2 is ready to merge', sub: 'Approved by Claude Code · +33', cta: 'Merge', run: () => merge('T2') });
  addNeed({ id: 'fix-T1', task: 'T1', who: 'codex', title: '2 changes asked on T1', sub: 'Claude can resume its session', cta: 'Send back', run: () => sendBack('T1') });
  $('#replay').classList.remove('live');
}

/* ---------------- views, theme, keys ---------------- */
function setView(v) {
  view = v;
  $('#canvasView').classList.toggle('hidden', v !== 'canvas');
  $('#boardView').classList.toggle('hidden', v !== 'board');
  $('.workspace').classList.toggle('board-mode', v === 'board'); $('.workspace').classList.remove('open');
  $('#seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  moveThumb();
  if (v === 'board') buildBoard(); else buildCanvas();
  paintAll();
  try { localStorage.setItem('thoth.view', v); } catch (e) {}
}
function moveThumb() { const b = $('#seg button.on'), th = $('#thumb'); th.style.left = b.offsetLeft + 'px'; th.style.width = b.offsetWidth + 'px'; }
$('#seg').querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));
$('#replay').onclick = replay;
$('#theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('thoth.theme', r.dataset.theme); } catch (e) {} };
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === '1') setView('canvas'); if (e.key === '2') setView('board');
  if (e.key.toLowerCase() === 'r') replay();
  if (e.key === 'f') fit();
  if (e.key === 'Escape') $('.workspace').classList.remove('open');
});
new ResizeObserver(() => { moveThumb(); if (view === 'canvas') fit(); }).observe($('#surface'));
setInterval(() => { if (S.tab === 'brain') $('#pane').querySelectorAll('time').forEach((el, i) => { const l = S.events.filter(e => S.filter === 'all' || e.kind === S.filter); if (l[i]) el.textContent = ago(l[i].t); }); }, 5000);

try { const th = localStorage.getItem('thoth.theme'); if (th) document.documentElement.dataset.theme = th; else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
let saved = 'canvas'; try { saved = localStorage.getItem('thoth.view') || 'canvas'; } catch (e) {}
setView(saved);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { moveThumb(); if (view === 'canvas') { drawEdges(); fit(); } });
setTimeout(replay, 500);
</script>
